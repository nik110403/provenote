name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils pandoc
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc poppler
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y poppler pandoc
          if ($LASTEXITCODE -ne 0) {
            throw "choco install failed with exit code $LASTEXITCODE"
          }
          $pandocBins = @(
            (Join-Path $env:ChocolateyInstall 'bin')
            (Join-Path $env:ProgramFiles 'Pandoc')
          ) | Where-Object { Test-Path (Join-Path $_ 'pandoc.exe') }
          if (-not $pandocBins) {
            throw 'choco install did not provide pandoc.exe'
          }
          $popplerBins = Get-ChildItem (Join-Path $env:ChocolateyInstall 'lib\poppler') -Filter 'pdftotext.exe' -File -Recurse |
            Select-Object -ExpandProperty DirectoryName
          if (-not $popplerBins) {
            throw 'choco install did not provide pdftotext.exe'
          }
          $dependencyBins = $pandocBins + $popplerBins
          $dependencyBins | Select-Object -Unique | Add-Content -Path $env:GITHUB_PATH
      - name: Verify native tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pandoc --version
          pdftotext -v
      - name: Strict plugin validation (claude CLI), else SKILL.md lint
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict plugins/research-kit
          else
            python scripts/lint-skills.py
          fi
      - name: Documented smoke
        run: python scripts/smoke.py
      - name: Installer dry-run (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/install-deps.sh --dry-run --typst
      - name: Installer dry-run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-deps.ps1 -DryRun -Typst
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Unix static checks
        if: runner.os != 'Windows'
        run: make check
